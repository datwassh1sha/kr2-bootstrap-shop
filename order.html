<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Моя корзина — Hot Wheels Deals</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="min-vh-100 d-flex flex-column">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html">
            HOT WHEELS DEALS<span class="text-danger">.</span>
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Открыть меню"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Главная</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="catalog.html">Каталог</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contacts.html">Контакты</a>
              </li>
              <li class="nav-item">
                <a href="order.html" class="nav-link">
                  Мой заказ
                  <span
                    class="badge bg-danger"
                    id="cart-count"
                    aria-label="Количество товаров в корзине"
                    >0</span
                  >
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-5 flex-grow-1">
      <h1 class="mb-4">Моя корзина</h1>

      <div id="cart-items"></div>

      <div id="cart-empty" class="text-secondary">Корзина пока пуста.</div>

      <div id="cart-summary" class="mt-4" hidden>
        <h2 class="h4">Итого: <span id="cart-total">0</span> ₽</h2>

        <button class="btn btn-outline-danger" id="clear-cart">
          Очистить корзину
        </button>

        <form id="order-form" class="mt-4">
          <h2 class="h4 mb-3">Оформление заказа</h2>

          <div class="mb-3">
            <label for="customer-name" class="form-label">Имя</label>
            <input
              type="text"
              class="form-control"
              id="customer-name"
              name="name"
              placeholder="Введите ваше имя"
              required
            />
          </div>

          <div class="mb-3">
            <label for="customer-email" class="form-label">
              Электронная почта
            </label>
            <input
              type="email"
              class="form-control"
              id="customer-email"
              name="email"
              placeholder="example@mail.com"
              required
            />
          </div>

          <div class="mb-3">
            <label for="customer-address" class="form-label">
              Адрес доставки
            </label>
            <textarea
              class="form-control"
              id="customer-address"
              name="address"
              rows="3"
              placeholder="Город, улица, дом, квартира"
              required
            ></textarea>
          </div>

          <button type="submit" class="btn btn-danger btn-lg">
            Подтвердить заказ
          </button>
        </form>
      </div>
      <p
        id="order-message"
        class="mt-3 mb-0"
        role="status"
        aria-live="polite"
      ></p>
    </main>

    <footer>
      <p>&copy; 2026 Учебный проект. Все права защищены.</p>
      <p>Дисциплина: Фронтенд и бэкенд разработка</p>
    </footer>
    <script src="js/order.js"></script>
    <script src="js/cart-counter.js"></script>
  </body>
</html>
